eda_params:
  target_column: "Class"
  correlation_threshold: 0.75
  outlier_method: "iqr"

ValidationSuite:
  active_validators:
    - SchemaValidator
    - DuplicateCheckValidator
    - ImbalanceValidator
    - DataLeakageValidator
    - DistributionDriftValidator
    - StratifiedSplitValidator
    - CrossValidationValidator
    - RepeatedCVStabilityValidator
    - ThresholdTuner
    - ConfusionMatrixValidator
    - CalibrationValidator
    - LearningCurveValidator
    - FeatureImportanceValidator
    - OverfitDetector
    - NoisePerturbationValidator
    - SubsampleStabilityValidator
  # General limits
  cv_max_rows: 50000
  stability_max_rows: 30000
  importance_max_rows: 20000

  # Split Strategy & Drift
  test_size: 0.20
  train_size: 0.70
  val_size: 0.15
  drift_alpha: 0.05
  split_tolerance: 0.02

  # Cross Validation & Stability
  n_splits: 5
  n_repeats: 3

  # Evaluation & Business Costs
  target_recall: 0.90
  fp_cost_eur: 3.0
  decision_threshold: 0.5
  calibration_bins: 10

  # Robustness checks
  noise_sigmas: [0.01, 0.05, 0.10, 0.20]
  subsample_fractions: [0.05, 0.10, 0.20, 0.40, 0.60, 0.80, 1.00]
  importance_estimators: 50

transformation:
  # ── 1. Cleaning ───────────────────────────────────────────
  cleaning:
    # Columns to drop unconditionally before any processing
    drop_columns: ["id", "Id", "ID"]

    # Missing value strategy per column type
    # "none" means: fail fast if missing values are found
    missing_strategy:
      numeric: median # mean | median | zero | none
      flag_missing: true # add <col>_was_missing indicator column

    # Outlier capping (Winsorisation) — applied to Amount only
    # PCA features are already standardised; capping distorts their geometry
    outlier_cap_columns: ["Amount"]
    outlier_lower_quantile: 0.001
    outlier_upper_quantile: 0.999

    # Minimum allowed rows after cleaning (pipeline aborts if below)
    min_rows_after_cleaning: 10000

  # ── 2. Feature Engineering ───────────────────────────────
  feature_engineering:
    # Log1p transform of Amount to reduce right skew
    log_transform_amount: true
    log_amount_col_name: Amount_log1p

    # Amount binning into risk buckets (edges in EUR)
    amount_bin_edges: [0, 1, 10, 50, 200, 500, 5000, 999999]
    amount_bin_labels:
      ["micro", "very_low", "low", "medium", "high", "very_high", "extreme"]
    amount_bin_col_name: Amount_risk_bucket

    # PCA feature interactions — product of top-k separable pairs
    # (V14*V12, V14*V10, V12*V10, V4*V11 are highly informative)
    pca_interaction_pairs:
      - ["V14", "V12"]
      - ["V14", "V10"]
      - ["V12", "V10"]
      - ["V4", "V11"]
      - ["V17", "V14"]

    # L2 norm of all PCA features as a single "distance from origin" signal
    add_pca_l2_norm: true
    pca_l2_norm_col_name: V_l2_norm

    # Amount z-score within the dataset (standardised but without sklearn)
    add_amount_zscore: true
    amount_zscore_col_name: Amount_zscore

    # Flag suspicious micro-transactions (common in fraud testing)
    micro_transaction_threshold: 1.0 # EUR
    micro_transaction_col_name: is_micro_transaction

    # Flag round-number amounts (e.g. exactly €100, €200 — fraud pattern)
    flag_round_amounts: true
    round_amount_col_name: is_round_amount
    round_amount_tolerance: 0.01 # within 1 cent of a round number

  # ── 3. Scaling ────────────────────────────────────────────
  scaling:
    # Strategy: standard | robust | minmax | none
    # "robust" is recommended for Amount (outlier-resistant)
    # "standard" is appropriate for PCA features (already ~N(0,1))
    strategy: standard

    # Columns excluded from scaling (already scaled or binary flags)
    exclude_columns:
      - Class
      - Amount_risk_bucket # ordinal encoded, not scaled
      - is_micro_transaction
      - is_round_amount

    # Columns to scale with RobustScaler instead of the default strategy
    robust_scale_columns: ["Amount", "Amount_log1p", "Amount_zscore"]

  # ── 4. Feature Selection ─────────────────────────────────
  feature_selection:
    # Strategy: mutual_info | variance | correlation | none
    strategy: mutual_info

    # Keep top-k features by mutual information score
    # Set to null to use threshold-based selection instead
    top_k_features: null

    # Minimum MI score to keep a feature (used if top_k_features is null)
    mi_score_threshold: 0.001

    # Remove features whose Spearman correlation exceeds this threshold
    # (removes the lower-MI member of each high-correlation pair)
    max_spearman_correlation: 0.95

    # Minimum variance threshold — drop near-constant features
    min_variance: 0.001

    # Subsample size for MI computation (full dataset is slow)
    mi_sample_size: 50000

  # ── 5. Train / Val / Test Split ──────────────────────────
  split:
    test_size: 0.15
    val_size: 0.15
    # train_size is implicit: 1 - test_size - val_size = 0.70
    stratify: true # always stratify on Class
    random_state: 42
    shuffle: true

  # ── 6. Resampling (optional) ─────────────────────────────
  resampling:
    # Strategy: smote | borderline_smote | adasyn | random_oversample |
    #           random_undersample | none
    # Applied to TRAINING SET ONLY after the split.
    strategy: smote

    # SMOTE / Borderline-SMOTE params
    k_neighbors: 5
    random_state: 42

    # Target minority:majority ratio after resampling
    # 1.0 = perfectly balanced; 0.5 = 1:2 minority:majority
    sampling_ratio: 1.0

    # Minimum minority samples required to attempt SMOTE
    min_minority_samples: 10

# ============================================================
# Model Training
# ============================================================
model_trainer:
  random_state: 42
  models_to_train:
    - logistic_regression
    - random_forest
    - xgboost
    - lightgbm

  tuning_enabled: true
  tuning_strategy: random
  tuning_n_iter: 20
  tuning_cv_folds: 5
  tuning_scoring: average_precision
  tuning_n_jobs: -1
  tuning_random_state: 42
  tuning_sample_size: 50000
  use_class_weight: true
  model_selection_metric: auprc

  param_grids:
    logistic_regression:
      clf__C: [0.001, 0.01, 0.1, 1.0, 10.0, 100.0]
      clf__penalty: ["l2"]

    random_forest:
      clf__n_estimators: [100, 200, 300, 500]
      clf__max_depth: [5, 10, 15, 20, null]
      clf__min_samples_split: [2, 5, 10]

    xgboost:
      clf__n_estimators: [100, 200, 300]
      clf__learning_rate: [0.01, 0.05, 0.1, 0.2]
      clf__max_depth: [3, 4, 5, 6, 8]

    lightgbm:
      clf__n_estimators: [100, 200, 300]
      clf__learning_rate: [0.01, 0.05, 0.1, 0.2]
      clf__num_leaves: [15, 31, 63, 127]

# ============================================================
# Model Evaluation Configuration
# ============================================================
model_evaluation:
  random_state: 42
  target_column: "Class"
  decision_threshold: null # null → use 0.5 or optimal threshold
  evaluate_all_models: true # compare every saved model, not just the best

  # ── Threshold Optimisation ───────────────────────────────
  optimize_threshold: true
  threshold_metric: "f2" # f1 | f2 | recall_at_precision | minimum_cost
  target_recall_floor: 0.90 # used only if threshold_metric = recall_at_precision

  # ── Cost-Sensitivity Assumptions ─────────────────────────
  fp_cost_eur: 3.0 # investigation cost per false alarm
  fn_cost_default_eur: 100.0 # fallback if Amount column unavailable
  fn_cost_multiplier: 1.0

  # ── Robustness & Validation Checks ────────────────────────
  run_calibration_check: true
  run_subgroup_analysis: true # performance broken down by Amount bucket
  compute_confidence_intervals: true
  n_bootstrap: 1000
  confidence_level: 0.95

  metrics:
    - accuracy
    - precision
    - recall
    - f1
    - f2
    - roc_auc
    - auprc
    - mcc
    - brier_score
