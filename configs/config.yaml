artifacts_root: artifacts

data_ingestion:
  root_dir: artifacts/data_ingestion
  ingestion_strategy: "kaggle_api"
  source_url_or_path: "nelgiriyewithana/credit-card-fraud-detection-dataset-2023"
  local_data_file: artifacts/data_ingestion/creditcard_2023.zip
  unzip_dir: data/raw

data_eda:
  root_dir: artifacts/data_eda
  data_path: data/raw/creditcard_2023.csv
  json_report_path: artifacts/data_eda/eda_report.json
  text_report_path: artifacts/data_eda/eda_report.txt

data_validation:
  root_dir: artifacts/data_validation
  raw_data_path: data/raw/creditcard_2023.csv
  validation_report_json: artifacts/data_validation/validation_report.json
  eda_report_json: artifacts/data_validation/eda_report.json

data_transformation:
  # ── Paths ────────────────────────────────────────────────
  root_dir: artifacts/data_transformation

  raw_data_path: data/raw/creditcard_2023.csv

  # Intermediate outputs (written by each stage)
  cleaned_data_path: artifacts/data_transformation/cleaned.parquet
  engineered_data_path: artifacts/data_transformation/engineered.parquet
  scaled_data_path: artifacts/data_transformation/scaled.parquet

  # Final split outputs
  train_path: artifacts/data_transformation/splits/train.parquet
  val_path: artifacts/data_transformation/splits/val.parquet
  test_path: artifacts/data_transformation/splits/test.parquet

  # Fitted artefact paths (persisted for inference)
  scaler_path: artifacts/data_transformation/artefacts/scaler.pkl
  selector_path: artifacts/data_transformation/artefacts/feature_selector.pkl
  metadata_path: artifacts/data_transformation/artefacts/transform_metadata.json

  # ── Column Roles ─────────────────────────────────────────
  target_column: Class # binary: 0=legit, 1=fraud
  id_column: id # row identifier — dropped before modelling
  amount_column: Amount # only raw financial feature (needs scaling)
  pca_prefix: V # V1…V28 are PCA-transformed features

  # ── Stage Activation Flags ────────────────────────────────
  # Set any flag to false to skip that stage entirely.
  run_cleaning: true
  run_feature_engineering: true
  run_scaling: true
  run_feature_selection: true
  run_split: true
  run_resampling: false # off by default — dataset is 50:50 balanced

# ============================================================
# Model Trainer
# ============================================================
model_trainer:
  root_dir: artifacts/model_trainer
  train_path: artifacts/data_transformation/splits/train.parquet
  val_path: artifacts/data_transformation/splits/val.parquet
  train_resampled_path: artifacts/data_transformation/splits/train_resampled.parquet
  use_resampled_train: false

  model_dir: artifacts/model_trainer/models
  best_model_path: artifacts/model_trainer/models/best_model.pkl
  metrics_path: artifacts/model_trainer/train_metrics.json
  tuning_results_path: artifacts/model_trainer/tuning_results.json

  target_column: Class

# ============================================================
# Model Evaluation
# ============================================================
model_evaluation:
  root_dir: artifacts/model_evaluation

  test_path: artifacts/data_transformation/splits/test.parquet
  model_dir: artifacts/model_trainer/models
  best_model_path: artifacts/model_trainer/models/best_model.pkl
  evaluation_report_path: artifacts/model_evaluation/evaluation_report.json
  comparison_table_path: artifacts/model_evaluation/model_comparison.json
  plots_dir: artifacts/model_evaluation/plots
  target_column: Class
